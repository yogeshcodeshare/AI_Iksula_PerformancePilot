name: Supabase keep-alive

# Free-plan Supabase projects pause after 7 days without activity.
# This calls the read-only public.ping() function twice a week.
# Needs two repository secrets (public values, same as in Vercel):
#   SUPABASE_URL, SUPABASE_ANON_KEY
# Not needed on the Pro plan; then delete this workflow.

on:
  schedule:
    - cron: '17 3 * * 1,4'   # Mon + Thu 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_ANON_KEY secrets not set - skipping keep-alive."
            exit 0
          fi
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"
