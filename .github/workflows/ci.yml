name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: my-app

jobs:
  test:
    name: Type check, unit tests, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Pre-existing lint errors in older source files are reported but do not
      # block merges yet (tracked as tech debt). New code must lint clean.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - name: Unit + component tests with coverage
        run: npm run test:coverage

      - name: Production build (static export)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (PageSpeed API mocked)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: my-app/playwright-report
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: my-app/coverage
          retention-days: 14
